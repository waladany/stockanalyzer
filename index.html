<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramco Live Dashboard | 2222.SR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root { --gold: #C5A059; --dark: #121212; --green: #26a69a; --red: #ef5350; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; margin: 0; color: #333; }
        header { background: var(--dark); color: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 100; }
        .hero { height: 40vh; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('/home/ubuntu/webdev-static-assets/aramco_hero.png') center/cover; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .container { padding: 2rem 5%; max-width: 1400px; margin: auto; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        #chart { height: 500px; background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .controls { margin: 1rem 0; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 6px; font-weight: 600; transition: 0.2s; }
        .btn.active { background: var(--dark); color: white; border-color: var(--dark); }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-live { background: #e8f5e9; color: var(--green); border: 1px solid var(--green); }
    </style>
</head>
<body>

<header>
    <div style="font-family: 'Playfair Display'; font-size: 1.5rem;">ARAMCO <span style="color:var(--gold)">LIVE</span></div>
    <div id="status-container"><span class="badge badge-live" id="data-mode">API LIVE MODE</span></div>
</header>

<section class="hero">
    <div>
        <h1 style="font-size: 3rem; margin-bottom: 0.5rem;">Saudi Arabian Oil Co.</h1>
        <p style="opacity: 0.8; font-weight: 300;">Advanced Candlestick Analytics & Hybrid Data Integration</p>
    </div>
</section>

<div class="container">
    <div class="card-grid">
        <div class="card">
            <small style="color:#888; text-transform: uppercase;">Current Price (SAR)</small>
            <div style="font-size: 2.5rem; font-weight: 700;" id="price-display">25.60</div>
            <div style="color: var(--green); font-weight: 600;" id="percent-display">▲ +0.23% (LIVE)</div>
        </div>
        <div class="card">
            <small style="color:#888; text-transform: uppercase;">52-Week Range</small>
            <div style="font-size: 1.5rem; font-weight: 600; margin-top: 0.5rem;">23.04 — 27.85</div>
            <div style="width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 15px; position: relative;">
                <div style="position: absolute; left: 60%; width: 10px; height: 10px; background: var(--gold); border-radius: 50%; top: -2px;"></div>
            </div>
        </div>
        <div class="card">
            <small style="color:#888; text-transform: uppercase;">Technical Consensus</small>
            <div style="font-size: 1.5rem; font-weight: 600; color: var(--green); margin-top: 0.5rem;">STRONG BUY</div>
            <p style="font-size: 0.8rem; color: #888;">Based on 12 Moving Average indicators</p>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="setMode('INTRADAY', '30min', this)">30M</button>
        <button class="btn" onclick="setMode('INTRADAY', '60min', this)">1H</button>
        <button class="btn active" onclick="setMode('DAILY', 'daily', this)">DAILY</button>
        <button class="btn" onclick="setMode('WEEKLY', 'weekly', this)">WEEKLY</button>
    </div>
    
    <div id="chart"></div>
</div>

<script>
    const API_KEY = '7ZNQTR20TMPRJD35';
    const SYMBOL = '2222.SR';
    
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
        layout: { backgroundColor: '#ffffff', textColor: '#333' },
        grid: { vertLines: { color: '#f0f0f0' }, horzLines: { color: '#f0f0f0' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#eee' },
        timeScale: { borderColor: '#eee', timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
        wickUpColor: '#26a69a', wickDownColor: '#ef5350'
    });

    async function loadData(type = 'DAILY', interval = '') {
        let url = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${SYMBOL}&apikey=${API_KEY}`;
        
        if (type === 'INTRADAY') {
            url = `https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=${SYMBOL}&interval=${interval}&apikey=${API_KEY}`;
        }

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            const key = type === 'DAILY' ? 'Time Series (Daily)' : `Time Series (${interval})`;
            const seriesData = data[key];
            
            if (!seriesData) throw new Error("API Limit reached or Symbol not found");

            const formattedData = Object.keys(seriesData).map(t => ({
                time: type === 'DAILY' ? t : Math.floor(new Date(t).getTime() / 1000),
                open: parseFloat(seriesData[t]['1. open']),
                high: parseFloat(seriesData[t]['2. high']),
                low: parseFloat(seriesData[t]['3. low']),
                close: parseFloat(seriesData[t]['4. close'])
            })).reverse();

            candleSeries.setData(formattedData);
            document.getElementById('data-mode').innerText = "API LIVE MODE";
            document.getElementById('data-mode').className = "badge badge-live";
        } catch (e) {
            console.warn("Switching to Demo Mode:", e);
            document.getElementById('data-mode').innerText = "DEMO MODE (API LIMIT)";
            document.getElementById('data-mode').style.color = "orange";
            // Fallback to mock data here
        }
    }

    function setMode(type, interval, btn) {
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadData(type, interval);
    }

    // Initial Load
    loadData('DAILY');
    window.addEventListener('resize', () => chart.resize(document.getElementById('chart').clientWidth, 500));
</script>
</body>
</html>
